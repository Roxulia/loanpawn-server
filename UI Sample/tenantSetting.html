<p class="text-on-surface-variant text-sm mt-1">Update tenant profile, branding colors, slip text, and business contact settings.</p>
</section>
<form class="space-y-6" onsubmit="return false;">
<!-- BEGIN: TenantProfileSection -->
<section class="bg-surface-container-lowest rounded-xl card-shadow overflow-hidden border border-outline-variant">

<h3 class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Tenant Profile</h3>
</div>
<div class="p-4 space-y-4">
<!-- Tenant Name -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="tenant_name">Tenant Name</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="tenant_name" name="tenant_name" type="text" value="Zin Lin Htet"/>
</div>
<!-- Tenant Code -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="tenant_code">Tenant Code</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="tenant_code" name="tenant_code" type="text" value="ZLH07ED"/>
</div>
<!-- License -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="license">License</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="license" name="license" type="text" value="trial / expired"/>
</div>
<!-- Plan Request -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider">Plan Request</label>
<button class="w-full bg-secondary text-on-secondary font-bold py-3 px-4 rounded-lg shadow btn-active transition-all text-sm font-jakarta" type="button">
            Change Plan
          </button>
</div>
<!-- License Key -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="license_key">License Key</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="license_key" name="license_key" type="text" value="BXGW8TEYURSQ9EQW"/>
</div>
</div>
</section>
<!-- END: TenantProfileSection -->
<!-- BEGIN: ContactSettingsSection -->

</div>
<div class="p-4 space-y-4">
<!-- Phone -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="phone">Phone</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="phone" name="phone" placeholder="Enter phone number" type="tel"/>
</div>
<!-- City -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="city">City</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="city" name="city" type="text" value="Tamwe, Yangon"/>
</div>
<!-- Country -->
<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="country">Country</label>
<input class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 bg-surface-container-lowest text-on-surface" id="country" name="country" type="text" value="Myanmar"/>
</div>

<div data-purpose="form-group">
<label class="block text-[10px] font-bold text-primary mb-1 uppercase tracking-wider" for="address">Address</label>
<textarea class="w-full border-outline-variant rounded-lg shadow-sm text-sm p-3 focus:ring-2 focus:ring-primary/20 resize-none bg-surface-container-lowest text-on-surface" id="address" name="address" rows="3">165th street</textarea>
