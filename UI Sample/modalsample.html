      box-shadow: 0 4px 12px -2px rgba(9, 29, 43, 0.08), 0 2px 6px -1px rgba(9, 29, 43, 0.04);

<body class="antialiased text-on-surface min-h-screen flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="bg-primary p-4 sticky top-0 z-50 shadow-md" data-purpose="mobile-header">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<!-- Hamburger Menu Toggle -->
<label class="text-on-primary cursor-pointer hover:text-secondary-fixed transition-colors" for="menu-toggle">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</label>
<div class="flex flex-col">
<h1 class="text-on-primary font-bold text-xl font-headline leading-tight">LonePawn</h1>
<span class="text-primary-fixed-dim text-[10px] uppercase tracking-wider font-body">Platform Workspace</span>
</div>
</div>
<!-- Log out Action Button -->
<button class="bg-primary border border-on-primary text-on-primary px-4 py-2 rounded-lg text-sm font-semibold hover:bg-on-primary hover:text-primary transition-colors font-body">
      Log out
    </button>
</div>
<!-- Hidden Checkbox for Menu Logic -->
<input class="hidden peer" id="menu-toggle" type="checkbox"/>
<!-- BEGIN: Mobile Dropdown Menu -->
<div class="hidden absolute top-full left-0 w-full bg-primary border-t border-on-primary-fixed-variant shadow-xl peer-checked:block animate-in slide-in-from-top-2 duration-200" id="mobile-menu">
<nav class="flex flex-col py-2">
<a class="flex items-center gap-3 px-6 py-4 text-on-primary hover:bg-on-primary-fixed-variant transition-colors" href="#">

</svg>
<span class="font-medium">Dashboard</span>
</a>
<a class="flex items-center gap-3 px-6 py-4 text-on-primary hover:bg-on-primary-fixed-variant transition-colors" href="#">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="font-medium">Tenants</span>
</a>
<a class="flex items-center gap-3 px-6 py-4 text-secondary-fixed bg-on-primary-fixed-variant/50" href="#">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="font-medium">Billing</span>

<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>

</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: Main Content Container -->
<main class="flex-grow p-4 max-w-lg mx-auto w-full" data-purpose="form-container">
<div class="bg-surface-container-lowest rounded-xl card-shadow border border-surface-variant overflow-hidden mb-6">
<div class="p-5 border-b border-surface-variant">
<h2 class="text-2xl font-bold text-primary font-headline">Submit Payment Attachment</h2>
</div>
<!-- BEGIN: Payment Form -->
<form class="p-5 space-y-5" id="payment-form">
<!-- Tenant Field -->
<div class="space-y-1.5" data-purpose="form-group">
<label class="block text-[11px] font-bold text-outline uppercase tracking-widest font-body" for="tenant">Tenant</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body" id="tenant" placeholder="Enter tenant name" type="text" value="A B C"/>
</div>
<!-- Amount Field -->
<div class="space-y-1.5" data-purpose="form-group">
<label class="block text-[11px] font-bold text-outline uppercase tracking-widest font-body" for="amount">Amount</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body" id="amount" placeholder="Enter amount" type="text" value="50,000 MMK"/>
</div>
<!-- Payment Reference Field -->
<div class="space-y-1.5" data-purpose="form-group">
<label class="block text-[11px] font-bold text-outline uppercase tracking-widest font-body" for="reference">Payment Reference</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body" id="reference" placeholder="Reference number" type="text"/>
</div>
<!-- Payment Attachment Field -->
<div class="space-y-1.5" data-purpose="form-group">
<label class="block text-[11px] font-bold text-outline uppercase tracking-widest font-body" for="attachment">Payment Attachment</label>
<div class="relative">
<input class="hidden" id="attachment" onchange="document.getElementById('file-name').textContent = this.files[0] ? this.files[0].name : 'No file chosen'" type="file"/>
<label class="flex items-center w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface-variant cursor-pointer hover:bg-surface-container-low transition-all font-body" for="attachment">
<span class="truncate" id="file-name">Choose File No file chosen</span>
</label>
</div>
</div>
<!-- Note Field -->
<div class="space-y-1.5" data-purpose="form-group">
<label class="block text-[11px] font-bold text-outline uppercase tracking-widest font-body" for="note">Note</label>
<textarea class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body" id="note" placeholder="Add any additional details here..." rows="4"></textarea>
</div>
</form>
<!-- END: Payment Form -->
</div>
<!-- BEGIN: Primary Action Button -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-surface-container-lowest border-t border-surface-variant md:relative md:bg-transparent md:border-0 md:p-0" data-purpose="form-footer">
<button class="w-full py-4 bg-primary text-on-primary font-bold rounded-lg shadow-lg active:scale-[0.98] transition-transform font-headline uppercase tracking-wide" form="payment-form" type="submit">
      Submit Payment
    </button>
</div>
<!-- END: Primary Action Button -->
<!-- Spacer for fixed bottom button on mobile -->
<div class="h-20 md:hidden"></div>
</main>
<!-- END: Main Content Container -->
</body></html>
